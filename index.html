<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vultures 2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sometype+Mono&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Sometype Mono', monospace;
    }

    body {
      margin: 0;
      padding: 40px;
      background-color: #fff;
      color: #000;
      display: flex;
      justify-content: center;
    }

    #playlist {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 700px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .track-title {
      width: 200px;
      font-size: 12px;
      text-align: right;
    }

    .play-pause {
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    input[type="range"] {
      flex: 1;
      cursor: pointer;
      accent-color: #000;
    }

    .time {
      width: 80px;
      text-align: left;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="playlist"></div>

  <script>
    const baseURL = "https://dn721802.ca.archive.org/0/items/vul2uresv111/vultures-2/";
    const tracks = [
      "01-slide.flac",
      "02-time-moving-slow.flac",
      "03-field-trip.flac",
      "04-fried.flac",
      "05-isabella.flac",
      "06-promotion.flac",
      "07-530.flac",
      "08-dead.flac",
      "09-forever-rolling.flac",
      "10-bomb.flac",
      "11-river.flac",
      "12-forever.flac",
      "13-husband.flac",
      "14-lifestyle.flac",
      "15-sky-city.flac",
      "16-my-soul.flac"
    ];

    const titles = [
      "Slide", "Time Moving Slow", "Field Trip", "Fried", "Isabella", "Promotion", "530", "Dead",
      "Forever Rolling", "Bomb", "River", "Forever", "Husband", "Lifestyle", "Sky City", "My Soul"
    ];

    const playlist = document.getElementById('playlist');
    const audioElements = [];

    tracks.forEach((file, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'track';

      const title = document.createElement('div');
      title.className = 'track-title';
      title.textContent = titles[index];

      const button = document.createElement('div');
      button.className = 'play-pause';
      button.textContent = '⏵';

      const audio = new Audio(baseURL + file);
      audio.preload = 'metadata';
      audio.crossOrigin = "anonymous";
      audioElements.push(audio);

      const progress = document.createElement('input');
      progress.type = 'range';
      progress.min = 0;
      progress.step = 1;
      progress.value = 0;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = '0:00 / 0:00';

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec < 10 ? '0' : ''}${sec}`;
      };

      audio.addEventListener('loadedmetadata', () => {
        progress.max = audio.duration;
        time.textContent = `0:00 / ${formatTime(audio.duration)}`;
      });

      audio.addEventListener('timeupdate', () => {
        progress.value = audio.currentTime;
        time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      });

      progress.addEventListener('input', () => {
        audio.currentTime = progress.value;
      });

      audio.addEventListener('ended', () => {
        button.textContent = '⏵';
        audio.currentTime = 0;
        const next = audioElements[index + 1];
        const nextBtn = playlist.querySelectorAll('.play-pause')[index + 1];
        if (next && nextBtn) {
          next.play();
          nextBtn.textContent = '⏸';
        }
      });

      button.addEventListener('click', () => {
        audioElements.forEach((a, i) => {
          if (a !== audio) {
            a.pause();
            a.currentTime = 0;
            playlist.querySelectorAll('.play-pause')[i].textContent = '⏵';
          }
        });

        if (audio.paused) {
          audio.play();
          button.textContent = '⏸';
        } else {
          audio.pause();
          button.textContent = '⏵';
        }
      });

      wrapper.appendChild(title);
      wrapper.appendChild(button);
      wrapper.appendChild(progress);
      wrapper.appendChild(time);
      playlist.appendChild(wrapper);
    });
  </script>
</body>
</html>
