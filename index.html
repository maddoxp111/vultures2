<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vultures 2 - Audio Stack</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sometype+Mono&display=swap');

    body {
      background-color: #fff;
      color: #000;
      font-family: 'Sometype Mono', monospace;
      font-size: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    #playlist {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 600px;
    }

    .track {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .track-title {
      width: 200px;
      text-align: right;
    }

    .play-pause {
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    input[type="range"] {
      accent-color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="playlist"></div>

  <script>
    const tracks = [
      { title: 'Slide', file: 'SLIDE.mp3' },
      { title: 'Time Moving Slow', file: 'TIME MOVING SLOW.mp3' },
      { title: 'Field Trip', file: 'FIELD TRIP.mp3' },
      { title: 'Fried', file: 'FRIED.mp3' },
      { title: 'Isabella', file: 'ISABELLA.mp3' },
      { title: 'Promotion', file: 'PROMOTION.mp3' },
      { title: '530', file: '530.mp3' },
      { title: 'Dead', file: 'DEAD.mp3' },
      { title: 'Forever Rolling', file: 'FOREVER ROLLING.mp3' },
      { title: 'Bomb', file: 'BOMB.mp3' },
      { title: 'River', file: 'RIVER.mp3' },
      { title: 'Forever', file: 'FOREVER.mp3' },
      { title: 'Husband', file: 'HUSBAND.mp3' },
      { title: 'Lifestyle', file: 'LIFESTYLE.mp3' },
      { title: 'Sky City', file: 'SKY CITY.mp3' },
      { title: 'My Soul', file: 'MY SOUL.mp3' },
      // Bonus Tracks
      { title: 'BELIEVER', file: 'BELIEVER.mp3' },
      { title: 'CAN U BE', file: 'CAN U BE.mp3' },
      { title: 'DRUNK', file: 'DRUNK.mp3' },
      { title: 'GUN TO MY HEAD', file: 'GUN TO MY HEAD.mp3' },
      { title: 'TAKE OFF YOUR DRESS', file: 'TAKE OFF YOUR DRESS.mp3' }
    ];

    const playlist = document.getElementById('playlist');
    const audioElements = [];

    tracks.forEach((track, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'track';

      const title = document.createElement('div');
      title.className = 'track-title';
      title.textContent = track.title;

      const button = document.createElement('div');
      button.className = 'play-pause';
      button.textContent = '⏵';

      const audio = new Audio(track.file);
      audioElements.push(audio);

      const progress = document.createElement('input');
      progress.type = 'range';
      progress.min = 0;
      progress.value = 0;
      progress.step = 1;
      progress.style.width = '200px';

      const timeLabel = document.createElement('div');
      timeLabel.style.minWidth = '75px';
      timeLabel.textContent = '0:00 / 0:00';

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' + s : s}`;
      };

      audio.addEventListener('timeupdate', () => {
        progress.value = audio.currentTime;
        timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      });

      audio.addEventListener('loadedmetadata', () => {
        progress.max = audio.duration;
        timeLabel.textContent = `0:00 / ${formatTime(audio.duration)}`;
      });

      progress.addEventListener('input', () => {
        audio.currentTime = progress.value;
      });

      audio.addEventListener('ended', () => {
        audio.currentTime = 0;
        button.textContent = '⏵';
        const next = audioElements[index + 1];
        const nextBtn = playlist.querySelectorAll('.play-pause')[index + 1];
        if (next && nextBtn) {
          next.play();
          nextBtn.textContent = '⏸';
        }
      });

      button.addEventListener('click', () => {
        audioElements.forEach((a, i) => {
          if (a !== audio) {
            a.pause();
            a.currentTime = 0;
            playlist.querySelectorAll('.play-pause')[i].textContent = '⏵';
          }
        });

        if (audio.paused) {
          audio.play();
          button.textContent = '⏸';
        } else {
          audio.pause();
          button.textContent = '⏵';
        }
      });

      wrapper.appendChild(title);
      wrapper.appendChild(button);
      wrapper.appendChild(progress);
      wrapper.appendChild(timeLabel);
      playlist.appendChild(wrapper);
    });
  </script>

</body>
</html>
